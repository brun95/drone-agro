<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" rx="12" fill="#0a1a0e"/>
  <!-- Drone body -->
  <rect x="26" y="26" width="12" height="12" rx="2" fill="#6cc04a"/>
  <!-- Drone arms -->
  <line x1="20" y1="20" x2="26" y2="26" stroke="#6cc04a" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="44" y1="20" x2="38" y2="26" stroke="#6cc04a" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="20" y1="44" x2="26" y2="38" stroke="#6cc04a" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="44" y1="44" x2="38" y2="38" stroke="#6cc04a" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Propellers -->
  <ellipse cx="18" cy="18" rx="6" ry="2.5" fill="#6cc04a" opacity="0.7" transform="rotate(-35 18 18)"/>
  <ellipse cx="46" cy="18" rx="6" ry="2.5" fill="#6cc04a" opacity="0.7" transform="rotate(35 46 18)"/>
  <ellipse cx="18" cy="46" rx="6" ry="2.5" fill="#6cc04a" opacity="0.7" transform="rotate(35 18 46)"/>
  <ellipse cx="46" cy="46" rx="6" ry="2.5" fill="#6cc04a" opacity="0.7" transform="rotate(-35 46 46)"/>
